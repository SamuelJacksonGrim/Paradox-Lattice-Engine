[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox-lattice-engine"
version = "0.1.0"
description = "A cognitive subsystem that turns contradictions into usable cognitive structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
